<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Tools | Campus Life</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body id="top">
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
  <!-- Each page uses the same navigation. -->
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html"><img src="images/campus.svg" alt="" width="32" height="32"> Campus Life</a>
      <nav aria-label="Main navigation"><a href="index.html">Home</a> <a href="events.html">Events</a> <a href="study.html" aria-current="page">Study Tools</a></nav>
    </div>
  </header>
  <main id="main" tabindex="-1" class="container py-4 py-md-5">
    <div class="intro">
      <h1>Study tools</h1>
      <p>Set aside time to focus and keep track of your assignments.</p>
    </div>
    <!-- Bootstrap columns stack on small screens. -->
    <div class="row g-3">
<section class="col-md-5"><div class="panel"><h2>Study timer</h2>
<label for="minutes" class="form-label">Minutes</label><input class="form-control" id="minutes" type="number" min="1" max="120" value="25">
<p class="countdown" id="countdown" role="timer">25:00</p><p id="timer-status" role="status">Ready to start.</p>
<div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" id="start" type="button">Start</button><button class="btn btn-outline-secondary" id="pause" type="button" disabled>Pause</button><button class="btn btn-outline-secondary" id="reset" type="button">Reset</button></div>
</div></section>
<section class="col-md-7"><div class="panel"><h2>My tasks</h2>
<form id="task-form"><label for="task-input" class="form-label">Assignment name</label><div class="d-flex gap-2"><input class="form-control" id="task-input" maxlength="100" required><button class="btn btn-primary text-nowrap">Add task</button></div></form>
<p id="task-count" class="mt-3" role="status"></p><ul id="tasks" class="list-group"></ul><p id="task-storage" class="mt-2" role="status"></p>
</div></section>
    </div>
  </main>
  <footer class="container site-footer">
    <span>Campus Life</span><a href="https://www.nicc.edu/contact/">Contact NICC</a><a href="#top">Back to top</a>
  </footer>
</body>
</html>
